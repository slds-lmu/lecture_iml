# Shared setup of the exercise sheets, synced from lecture_service
# (exercises-template/, see README.md). Don't edit it here: changes are
# overwritten by `make update`. Lecture-specific settings (course subtitle,
# extra CSS or filters) go into _lecture.yml, which is merged in below
# and wins over this file for single values; lists such as filters are combined.
metadata-files:
  - _lecture.yml
theme: [flatly, _quarto/theme.scss]
format:
  html:
    toc: true
    embed-resources: true
    format-links: false
    # HTML only: as a global knitr option it would also reach the PDF, where knitr
    # then sizes the figures by their 300 dpi (a 5in figure becomes 15.6in wide)
    knitr:
      opts_chunk:
        fig.retina: 1.5  # knitr figures at 1.5x their display size (default 2x): ~40% smaller, same size on the page
  pdf:
    pdf-engine: pdflatex
    include-in-header:
      file: _quarto/pdf-preamble.tex
filters:
  - _quarto/filters.lua
notebook-links: global
